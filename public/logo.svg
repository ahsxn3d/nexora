<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%" fill="none">
  <!-- Nexora Academic Emblem: Serif 'N' + Open Book Base + Olive & Gold Compass Star -->
  <defs>
    <linearGradient id="gold-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E9D390" />
      <stop offset="50%" stop-color="#CFA24D" />
      <stop offset="100%" stop-color="#A57A2A" />
    </linearGradient>
    <linearGradient id="gold-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#CFA24D" />
      <stop offset="100%" stop-color="#845D1C" />
    </linearGradient>
    <linearGradient id="green-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F8E74" />
      <stop offset="100%" stop-color="#4B6A51" />
    </linearGradient>
    <linearGradient id="green-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4B6A51" />
      <stop offset="100%" stop-color="#2D4632" />
    </linearGradient>
    <filter id="subtle-glow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.15" />
    </filter>
  </defs>

  <g filter="url(#subtle-glow)">
    <!-- Main Academic Serif Letter 'N' -->
    <!-- Left Stem with top and bottom serifs -->
    <path d="M 160 175 L 205 175 C 196 175 192 182 192 195 L 192 335 C 192 348 196 355 205 355 L 160 355 C 170 355 174 348 174 335 L 174 195 C 174 182 170 175 160 175 Z" fill="#1C1510" />

    <!-- Diagonal Bar -->
    <path d="M 174 182 L 305 345 L 305 315 L 190 175 Z" fill="#1C1510" />

    <!-- Right Stem -->
    <path d="M 292 250 L 305 250 L 305 335 C 305 348 301 355 292 355 L 325 355 C 316 355 312 348 312 335 L 312 250 Z" fill="#1C1510" />
    <!-- Right Upper Stem reaching under star -->
    <path d="M 300 250 L 300 260 L 306 240 L 312 260 L 312 250 Z" fill="#1C1510" />

    <!-- Open Book Foundation at base -->
    <!-- Upper Book Page Layer -->
    <path d="M 135 290 C 195 288 235 305 250 332 C 265 305 305 288 365 290 C 372 290 375 295 370 298 C 315 310 270 326 250 348 C 230 326 185 310 130 298 C 125 295 128 290 135 290 Z" fill="#1C1510" />
    
    <!-- Lower Book Page Layer -->
    <path d="M 125 310 C 190 308 235 324 250 348 C 265 324 310 308 375 310 C 382 310 384 316 378 320 C 320 334 272 350 250 372 C 228 350 180 334 122 320 C 116 316 118 310 125 310 Z" fill="#1C1510" />

    <!-- Spine Ring Accent -->
    <path d="M 230 340 C 235 356 265 356 270 340 C 265 350 235 350 230 340 Z" fill="#1C1510" />

    <!-- Star / Compass Beacon (8-Point Faceted Multi-Star) -->
    <!-- Small diagonal background points (Olive Green) -->
    <g transform="translate(300, 195)">
      <!-- Top-Right Point -->
      <polygon points="0,0 20,-20 4,-4" fill="url(#green-light)" />
      <polygon points="0,0 20,-20 20,4" fill="url(#green-dark)" />
      <!-- Top-Left Point -->
      <polygon points="0,0 -20,-20 -4,-4" fill="url(#green-dark)" />
      <polygon points="0,0 -20,-20 -20,4" fill="url(#green-light)" />
      <!-- Bottom-Right Point -->
      <polygon points="0,0 20,20 4,4" fill="url(#green-light)" />
      <polygon points="0,0 20,20 20,-4" fill="url(#green-dark)" />
      <!-- Bottom-Left Point -->
      <polygon points="0,0 -20,20 -4,4" fill="url(#green-dark)" />
      <polygon points="0,0 -20,20 -20,-4" fill="url(#green-light)" />

      <!-- Major 4-Point Star Facets (Gold & Green) -->
      <!-- Top Spire -->
      <polygon points="0,0 0,-60 14,-14" fill="url(#gold-light)" />
      <polygon points="0,0 0,-60 -14,-14" fill="url(#green-dark)" />
      
      <!-- Right Spire -->
      <polygon points="0,0 60,0 14,14" fill="url(#gold-dark)" />
      <polygon points="0,0 60,0 14,-14" fill="url(#gold-light)" />
      
      <!-- Bottom Spire -->
      <polygon points="0,0 0,60 -14,14" fill="url(#green-dark)" />
      <polygon points="0,0 0,60 14,14" fill="url(#gold-dark)" />
      
      <!-- Left Spire -->
      <polygon points="0,0 -60,0 -14,-14" fill="url(#green-light)" />
      <polygon points="0,0 -60,0 -14,14" fill="url(#green-dark)" />

      <!-- Center Star Core Glow -->
      <circle cx="0" cy="0" r="3" fill="#FFF8E7" />
    </g>
  </g>
</svg>
