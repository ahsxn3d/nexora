<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Faceted gold gradients -->
    <linearGradient id="gold-bright" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#EED58E" />
      <stop offset="50%" stop-color="#CE9F44" />
      <stop offset="100%" stop-color="#A27725" />
    </linearGradient>
    <linearGradient id="gold-shade" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#C2943A" />
      <stop offset="100%" stop-color="#7B5614" />
    </linearGradient>

    <!-- Faceted olive green gradients -->
    <linearGradient id="olive-light" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#6F8F75" />
      <stop offset="100%" stop-color="#4C6C52" />
    </linearGradient>
    <linearGradient id="olive-dark" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4C6C52" />
      <stop offset="100%" stop-color="#2D4632" />
    </linearGradient>
  </defs>

  <!-- Square with smooth rounded corners & exact light cream background -->
  <rect width="500" height="500" rx="90" fill="#F8F4EA" />

  <!-- Logo Mark Group -->
  <g id="nexora-emblem" transform="translate(10, 5)">
    <!-- Academic Serif Letter 'N' in Deep Obsidian Black -->
    <!-- Left vertical stem with serifs -->
    <path d="M 152 175 L 202 175 C 190 175 186 182 186 196 L 186 332 C 186 346 190 353 202 353 L 152 353 C 164 353 168 346 168 332 L 168 196 C 168 182 164 175 152 175 Z" fill="#1C1611" />
    
    <!-- Diagonal stroke -->
    <path d="M 168 182 L 306 346 L 306 312 L 186 175 Z" fill="#1C1611" />
    
    <!-- Right vertical stem with bottom serif and upper notch under star -->
    <path d="M 290 250 L 306 250 L 306 332 C 306 346 302 353 290 353 L 324 353 C 312 353 308 346 308 332 L 308 250 Z" fill="#1C1611" />
    <path d="M 293 250 L 293 275 L 300 248 L 307 275 L 307 250 Z" fill="#1C1611" />

    <!-- Open Book at Foundation -->
    <!-- Top page contour (Left & Right pages) -->
    <path d="M 128 288 C 188 286 230 304 250 330 C 270 304 312 286 372 288 C 378 288 380 293 375 296 C 318 308 274 324 250 348 C 226 324 182 308 125 296 C 120 293 122 288 128 288 Z" fill="#1C1611" />

    <!-- Bottom page contour -->
    <path d="M 116 308 C 182 306 228 322 250 348 C 272 322 318 306 384 308 C 390 308 392 314 386 318 C 324 332 276 348 250 370 C 224 348 176 332 114 318 C 108 314 110 308 116 308 Z" fill="#1C1611" />

    <!-- Spine curve ring -->
    <path d="M 228 338 C 234 356 266 356 272 338 C 266 349 234 349 228 338 Z" fill="#1C1611" />

    <!-- 8-Point Compass Star Beacon atop right serif -->
    <g transform="translate(300, 195)">
      <!-- 4 Diagonal Points (Olive Green) -->
      <!-- Top-Right Point -->
      <polygon points="0,0 24,-24 5,-5" fill="url(#olive-light)" />
      <polygon points="0,0 24,-24 24,5" fill="url(#olive-dark)" />
      <!-- Top-Left Point -->
      <polygon points="0,0 -24,-24 -5,-5" fill="url(#olive-dark)" />
      <polygon points="0,0 -24,-24 -24,5" fill="url(#olive-light)" />
      <!-- Bottom-Right Point -->
      <polygon points="0,0 24,24 5,5" fill="url(#olive-light)" />
      <polygon points="0,0 24,24 24,-5" fill="url(#olive-dark)" />
      <!-- Bottom-Left Point -->
      <polygon points="0,0 -24,24 -5,5" fill="url(#olive-dark)" />
      <polygon points="0,0 -24,24 -24,-5" fill="url(#olive-light)" />

      <!-- 4 Major Spires (Antique Gold & Olive) -->
      <!-- Top Spire -->
      <polygon points="0,0 0,-68 16,-16" fill="url(#gold-bright)" />
      <polygon points="0,0 0,-68 -16,-16" fill="url(#olive-dark)" />
      
      <!-- Right Spire -->
      <polygon points="0,0 68,0 16,16" fill="url(#gold-shade)" />
      <polygon points="0,0 68,0 16,-16" fill="url(#gold-bright)" />
      
      <!-- Bottom Spire -->
      <polygon points="0,0 0,68 -16,16" fill="url(#olive-dark)" />
      <polygon points="0,0 0,68 16,16" fill="url(#gold-shade)" />
      
      <!-- Left Spire -->
      <polygon points="0,0 -68,0 -16,-16" fill="url(#olive-light)" />
      <polygon points="0,0 -68,0 -16,16" fill="url(#olive-dark)" />

      <!-- Core accent -->
      <circle cx="0" cy="0" r="3.5" fill="#FFFDF8" />
    </g>
  </g>
</svg>
